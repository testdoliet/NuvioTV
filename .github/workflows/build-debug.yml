name: Build NuvioTV Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: 📝 Criar local.properties com valores dummy
        run: |
          touch local.properties
          echo "# Arquivo gerado automaticamente para CI" > local.properties
          echo "PARENTAL_GUIDE_API_URL=\"https://dummy-parental-guide.com\"" >> local.properties
          echo "INTRODB_API_URL=\"https://dummy-introdb.com\"" >> local.properties
          echo "TRAILER_API_URL=\"https://dummy-trailer.com\"" >> local.properties
          echo "IMDB_RATINGS_API_BASE_URL=\"https://dummy-imdb-ratings.com\"" >> local.properties
          echo "IMDB_TAPFRAME_API_BASE_URL=\"https://dummy-imdb-tapframe.com\"" >> local.properties
          echo "TRAKT_CLIENT_ID=\"dummy_trakt_client_id_123456\"" >> local.properties
          echo "TRAKT_CLIENT_SECRET=\"dummy_trakt_secret_abcdef\"" >> local.properties
          echo "TRAKT_API_URL=\"https://api.trakt.tv/\"" >> local.properties
          echo "TRAKT_REDIRECT_URI=\"urn:ietf:wg:oauth:2.0:oob\"" >> local.properties
          echo "TMDB_API_KEY=\"dummy_tmdb_key_789012\"" >> local.properties
          echo "TV_LOGIN_WEB_BASE_URL=\"https://app.nuvio.tv/tv-login\"" >> local.properties
          echo "SUPABASE_URL=\"https://dummy.supabase.co\"" >> local.properties
          echo "SUPABASE_ANON_KEY=\"dummy_supabase_anon_key_xyz\"" >> local.properties
          echo "DONATIONS_BASE_URL=\"https://dummy-donations.com\"" >> local.properties
          echo "DONATIONS_DONATE_URL=\"https://dummy-donations.com/donate\"" >> local.properties
          echo "AVATAR_PUBLIC_BASE_URL=\"https://dummy-avatars.com\"" >> local.properties
          
          # Mostrar o conteúdo para debug (opcional)
          echo "📄 Conteúdo do local.properties:"
          cat local.properties

      - name: 🔑 Criar keystore fictícia para debug
        run: |
          keytool -genkey -v -keystore nuviotv.jks -alias nuviotv -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 815787 -keypass 815787 \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=Debug"
          echo "✅ Keystore criada com sucesso!"
          ls -la nuviotv.jks

      - name: 🏗️ Compilar APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: nuviotv-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug-*.apk
          retention-days: 30
          compression-level: 6

      - name: 📊 Upload de relatórios (se houver falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports/
            build/reports/
