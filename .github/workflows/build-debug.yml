name: Build NuvioTV Debug APK

on:
  workflow_dispatch:  # Permite executar manualmente
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: 📝 Criar local.properties (vazio, só para não faltar)
        run: |
          touch local.properties
          echo "# Arquivo gerado automaticamente para CI" > local.properties
          echo "PARENTAL_GUIDE_API_URL=\"\"" >> local.properties
          echo "INTRODB_API_URL=\"\"" >> local.properties
          echo "TRAILER_API_URL=\"\"" >> local.properties
          echo "IMDB_RATINGS_API_BASE_URL=\"\"" >> local.properties
          echo "IMDB_TAPFRAME_API_BASE_URL=\"\"" >> local.properties
          echo "TRAKT_CLIENT_ID=\"\"" >> local.properties
          echo "TRAKT_CLIENT_SECRET=\"\"" >> local.properties
          echo "TMDB_API_KEY=\"\"" >> local.properties
          echo "SUPABASE_URL=\"\"" >> local.properties
          echo "SUPABASE_ANON_KEY=\"\"" >> local.properties

      - name: 🏗️ Compilar APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: nuviotv-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug-*.apk
          retention-days: 30
          compression-level: 6

      - name: 📊 Upload de relatórios (se houver falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports/
            build/reports/
